server:
  port: 8080

app:
  name: Task List Manager
  version: 1.0.0
  api:
    version: "2.0.0"
  uploads:
    directory: uploads

spring:
  profiles:
    active: dev
  jpa:
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    display-request-duration: true
  packages-to-scan: com.mipt.andreysofronov
  show-actuator: false

openapi:
  title: "To-Do List API"
  description: "REST API для управления задачами, вложениями, избранным и пользовательскими настройками."
  contact:
    name: "API Support"
    email: "api-support@example.com"

